<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活俠傳劇情圖 | Legend of Mortal Story Map</title>
    <link rel="stylesheet" href="style.css">
    <script>
        try { var t = localStorage.getItem('portal_theme'); var h = new Date().getHours(); if (t === 'light' || (t !== 'dark' && h >= 6 && h < 18)) document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    </script>
</head>
<body>
    <header class="topbar">
        <a class="back" href="/">← 入口</a>
        <h1>活俠傳劇情圖</h1>
        <div class="search">
            <input id="search" type="search" placeholder="搜尋事件、選項、結局，例如：小梅 結緣、喇嗲、慷慨就義" autocomplete="off">
            <ul id="results" class="results" hidden></ul>
        </div>
        <div class="zoom">
            <button id="zoom-in" type="button" title="放大">＋</button>
            <button id="zoom-out" type="button" title="縮小">－</button>
            <button id="zoom-fit" type="button" title="全部顯示">⤢</button>
        </div>
    </header>
    <nav class="goalbar" id="goalbar"></nav>

    <div id="banner" class="banner" hidden></div>

    <main class="layout">
        <section class="canvas" id="canvas">
            <div class="crumb" id="crumb" hidden></div>
            <div class="home" id="home">
                <h2>想查哪條路線？</h2>
                <p>在上面的搜尋框輸入事件、選項或結局，例如「小梅 結緣」「喇嗲」「慷慨就義」，或直接選一條結緣攻略。畫面只會顯示那條路線上的事件。</p>
                <h3>結緣攻略</h3>
                <div class="chips big" id="home-romance"></div>
                <details>
                    <summary>結局：汗青書</summary>
                    <div class="chips" id="home-ends"></div>
                </details>
                <details>
                    <summary>猝死結局：生死簿</summary>
                    <div class="chips" id="home-badends"></div>
                </details>
                <button class="ghost" id="home-map" type="button">顯示完整地圖（所有事件與路線）</button>
            </div>
            <svg id="tree" xmlns="http://www.w3.org/2000/svg">
                <g id="viewport">
                    <g id="edges"></g>
                    <g id="nodes"></g>
                    <g id="labels"></g>
                </g>
            </svg>
        </section>

        <aside class="panel" id="panel">
            <div id="panel-body"></div>
            <p class="source" id="source"></p>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
