<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活俠傳劇情圖 | Legend of Mortal Story Map</title>
    <link rel="stylesheet" href="style.css">
    <script>
        try { var t = localStorage.getItem('portal_theme'); var h = new Date().getHours(); if (t === 'light' || (t !== 'dark' && h >= 6 && h < 18)) document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    </script>
</head>
<body>
    <header class="topbar">
        <a class="back" href="/">← 入口</a>
        <h1>活俠傳劇情圖</h1>
        <div class="search">
            <input id="search" type="search" placeholder="搜尋事件、選項、結局，例如：小梅 結緣、喇嗲、慷慨就義" autocomplete="off">
            <ul id="results" class="results" hidden></ul>
        </div>
        <div class="zoom">
            <button id="zoom-in" type="button" title="放大">＋</button>
            <button id="zoom-out" type="button" title="縮小">－</button>
            <button id="zoom-fit" type="button" title="全部顯示">⤢</button>
        </div>
    </header>
    <nav class="goalbar" id="goalbar"></nav>

    <div id="banner" class="banner" hidden></div>

    <main class="layout">
        <section class="canvas" id="canvas">
            <div class="crumb" id="crumb" hidden>
                <button id="crumb-back" type="button">← 回到事件地圖</button>
                <span>事件流程圖：<b id="crumb-title"></b></span>
            </div>
            <svg id="tree" xmlns="http://www.w3.org/2000/svg">
                <g id="viewport">
                    <g id="edges"></g>
                    <g id="nodes"></g>
                    <g id="labels"></g>
                </g>
            </svg>
        </section>

        <aside class="panel" id="panel">
            <div id="panel-body"></div>
            <p class="source" id="source"></p>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
